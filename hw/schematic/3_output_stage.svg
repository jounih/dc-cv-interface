99999999996" dy="11">Ratiometric: with the reference off (power-on / soft reset) Vdac = Vb = 0 -&gt; 0 V at the jack.</tspan></text><text x="3.5999999999999996" y="244.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="3.5999999999999996" dy="11">Keep C8 small: Vb must track VREF as fast as the DAC does (SPICE: 10 nF -&gt; 5.8 V blip, 100 pF -&gt; 5 mV).</tspan></text><circle cx="198" cy="-22.5" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><text x="198.0" y="-27.200000000000003" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="198.0" dy="11">SUMn</tspan></text><circle cx="349.2" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="457.742" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><text x="464.0422863405995" y="-11.0" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="464.0422863405995" dy="11">OUTn jack tip</tspan></text><circle cx="349.2" cy="21.6" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><text x="355.5" y="10.599999999999998" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="355.5" dy="11">BAT54S DCn: to +12V and from -12V</tspan></text></svg>