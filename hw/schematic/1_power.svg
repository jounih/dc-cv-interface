lack;fill:black;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="-32.4" y="-128.8" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="-32.4" dy="10">Sheet 1 - power tree. USB-C 5 V is primary; the Eurorack header and the LiPo boost are optional.</tspan></text><text x="0.0" y="-69.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="0.0" dy="10">S3 VBUS</tspan><tspan x="0.0" dy="10">(USB-C 5 V)</tspan></text><text x="0.0" y="3.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="0.0" dy="10">LiPo boost J4</tspan><tspan x="0.0" dy="10">(optional, 5.1 V)</tspan></text><text x="162.0" y="-69.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="162.0" dy="10">U20 LM66100</tspan><tspan x="162.0" dy="10">ideal diode</tspan></text><text x="162.0" y="3.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="162.0" dy="10">U21 LM66100</tspan><tspan x="162.0" dy="10">ideal diode</tspan></text><text x="324.0" y="-33.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="324.0" dy="10">+5V_SYS</tspan><tspan x="324.0" dy="10">22 uF</tspan></text><text x="486.0" y="-38.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="486.0" dy="10">L20 10 uH -&gt;</tspan><tspan x="486.0" dy="10">U22 A0515S-2WR3</tspan><tspan x="486.0" dy="10">5 V -&gt; +-15 V, 2 W</tspan></text><text x="666.0" y="-38.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="666.0" dy="10">pi filters</tspan><tspan x="666.0" dy="10">22u-10uH-22u</tspan><tspan x="666.0" dy="10">SS14 diode-OR</tspan></text><text x="846.0" y="-38.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="846.0" dy="10">TPS7A4901 +11 V</tspan><tspan x="846.0" dy="10">TPS7A3001 -11 V</tspan><tspan x="846.0" dy="10">(op-amp rails)</tspan></text><text x="666.0" y="88.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="666.0" dy="10">Eurorack J1 +-12 V</tspan><tspan x="666.0" dy="10">SS14 per rail</tspan><tspan x="666.0" dy="10">RACK_SENSE -&gt; GPIO2</tspan></text><text x="180.0" y="129.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="180.0" dy="10">AMS1117-3.3 -&gt; +3V3_D</tspan><tspan x="180.0" dy="10">codec VDD, ADC DVDD</tspan></text><text x="342.0" y="129.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="342.0" dy="10">LP5907-3.3 -&gt; +3V3_A</tspan><tspan x="342.0" dy="10">DAC8568 / ADS131M08</tspan></text><text x="504.0" y="129.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="504.0" dy="10">LP5907-4.5 -&gt; +4V5_A</tspan><tspan x="504.0" dy="10">PCM3168A, input amps</tspan></text><text x="-31.01237418638713" y="212.17843808636846" dominant-baseline="hanging" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="-31.01237418638713" dy="10">RAIL_SENSE = +11 V x 10k/110k -&gt; GPIO1: outputs forced to 0 V below 10.5 V and until 100 ms stable.</tspan></text><text x="-31.01237418638713" y="240.97843808636844" dominant-baseline="hanging" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="-31.01237418638713" dy="10">Budget, full population: ~0.75 A at 5 V (USB-C 1.5 A or a USB 3 port). Precision-only: ~0.35 A.</tspan></text></svg>