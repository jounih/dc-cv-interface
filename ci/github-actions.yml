# Copy to .github/workflows/build.yml if this repo is ever pushed to GitHub.
name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: apt-get update -q && apt-get install -y -q ngspice python3-venv build-essential
      - name: Checks (host tests, ngspice, hw generation, both ESP-IDF builds)
        run: |
          python3 -m venv .venv && .venv/bin/pip install -q schemdraw
          IDF_PATH=/opt/esp/idf ./check.sh || (tail -n 40 logs/*.log; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/esp32s3/build/cv_interface.bin
            firmware/esp32s3/build-tiera/cv_interface.bin
